[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tastematch-ai"
version = "0.1.0"
description = "TasteMatch AI - Unified LLM Provider Switcher & Spotify AI Playlist Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
tastematch = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
